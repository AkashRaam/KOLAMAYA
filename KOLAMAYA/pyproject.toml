[project]
name = "kolamaya"
version = "1.0.0"
description = "Full-stack South Indian kolam generation, completion, and analysis studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask>=3.0,<4.0",
  "Pillow>=10.0,<12.0",
  "numpy>=1.26,<3.0",
]

[tool.vercel]
entrypoint = "app:app"
